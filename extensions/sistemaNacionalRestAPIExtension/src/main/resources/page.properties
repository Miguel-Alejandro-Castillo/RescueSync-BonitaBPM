#The technical name of the REST API extension
#Must be URL compliant (alpha-numeric characters with no whitespace) and be prefixed by "custompage_"
name=custompage_sistemaNacionalRestAPIExtension

#Name displayed in the Portal
displayName=Sistema Nacional REST API Extension

#Description displayed in the Portal
description=REST API to manage Sistema Nacional

#Must be apiExtension for a REST API extension
contentType=apiExtension

#Declare at least one API extension here (comma-separated list)
apiExtensions=sistemaNacionalRestAPIExtension,ongsRestAPIExtension,recursosRestAPIExtension,categoriasRestAPIExtension

#For each declared API extension,  specify the
#following properties: method,pathTemplate,classFileName and permissions

#Specify one HTTP verb from GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|TRACE
#GET is the recommended value for a REST API extension.
#Write operations should be performed by a process.
sistemaNacionalRestAPIExtension.method=GET

#Define the URL path template
#Resulting URL: ../API/extension/sistemaNacional
sistemaNacionalRestAPIExtension.pathTemplate=sistemaNacional

#Declare the associated RestAPIController class name
sistemaNacionalRestAPIExtension.className=ar.com.rescuesync.rest.api.Index

#Declare the permissions list (comma-separated list)
#For each permission declared, you must map it either to a profile (for example User, Administrator, or a custom profile) or to a specific user.
#Edit the custom-permissions-mapping.properties configuration file.
#For example: user|john=[read_sistema_nacional] or profile|User=[read_sistema_nacional]
#In production, use the platform-setup tool.
#In the studio, go to menu Development > REST API Extension > Edit permissions mapping.
sistemaNacionalRestAPIExtension.permissions=read_sistema_nacional


ongsRestAPIExtension.method=GET
ongsRestAPIExtension.pathTemplate=sistemaNacional/ongs
ongsRestAPIExtension.className=ar.com.rescuesync.rest.api.Ongs
ongsRestAPIExtension.permissions=read_sistema_nacional

recursosRestAPIExtension.method=GET
recursosRestAPIExtension.pathTemplate=sistemaNacional/recursos
recursosRestAPIExtension.className=ar.com.rescuesync.rest.api.Recursos
recursosRestAPIExtension.permissions=read_sistema_nacional

categoriasRestAPIExtension.method=GET
categoriasRestAPIExtension.pathTemplate=sistemaNacional/categorias
categoriasRestAPIExtension.className=ar.com.rescuesync.rest.api.Categorias
categoriasRestAPIExtension.permissions=read_sistema_nacional
